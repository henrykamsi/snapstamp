<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapStamp - HGT Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700 text-center">
        <h1 class="text-4xl font-bold mb-2 text-blue-500"><i class="fa-solid fa-video"></i> SnapStamp</h1>
        <p class="text-gray-400 mb-8">Download and watermark videos, Powered by HGT</p>

        <div class="mb-6">
            <input type="url" id="videoUrl" placeholder="Paste your video link here..." 
                class="w-full p-4 rounded-lg bg-gray-700 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 outline-none transition-all placeholder-gray-400">
        </div>

        <button id="processBtn" onclick="processVideo()" 
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-lg transition-all flex items-center justify-center gap-2">
            <span>Process Video</span>
            <i class="fa-solid fa-wand-magic-sparkles"></i>
        </button>

        <!-- Loading Animation State -->
        <div id="loadingState" class="hidden mt-8 flex-col items-center">
            <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p id="loadingText" class="text-blue-400 font-medium">Fetching video stream...</p>
            <p class="text-sm text-gray-500 mt-2">Please wait, processing time depends on video length.</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden mt-6 p-4 bg-red-900/50 border border-red-500 text-red-200 rounded-lg">
            <p id="errorMsg"></p>
        </div>

        <!-- Result State with Download Button -->
        <div id="resultState" class="hidden mt-8 p-6 bg-gray-700 rounded-xl border border-gray-600 shadow-inner">
            <div class="w-full bg-gray-900 rounded-lg aspect-video flex items-center justify-center mb-4 overflow-hidden border border-gray-800">
                <i class="fa-solid fa-circle-check text-6xl text-green-500"></i>
            </div>
            <h3 class="text-xl font-bold mb-1">Processing Complete!</h3>
            <p class="text-gray-400 text-sm mb-6">Your HGT watermark has been applied.</p>
            <a id="downloadBtn" href="#" class="w-full flex items-center justify-center bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-6 rounded-lg transition-all shadow-lg">
                <i class="fa-solid fa-download mr-2"></i> Download Video
            </a>
        </div>
    </div>

    <script>
        async function processVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const processBtn = document.getElementById('processBtn');
            const loadingState = document.getElementById('loadingState');
            const resultState = document.getElementById('resultState');
            const errorState = document.getElementById('errorState');
            const errorMsg = document.getElementById('errorMsg');
            const loadingText = document.getElementById('loadingText');
            
            if (!urlInput) {
                showError("Please enter a valid URL.");
                return;
            }

            // Reset UI for new request
            errorState.classList.add('hidden');
            resultState.classList.add('hidden');
            processBtn.classList.add('hidden');
            loadingState.classList.remove('hidden');
            
            // Cycle loading messages to show activity
            const statuses = ["Downloading video data...", "Applying HGT watermark...", "Finalizing your file..."];
            let step = 0;
            const statusInterval = setInterval(() => {
                step = (step + 1) % statuses.length;
                loadingText.innerText = statuses[step];
            }, 4000);

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();
                clearInterval(statusInterval);

                if (!response.ok) throw new Error(data.error || "Failed to process video");

                // Switch to Result UI
                loadingState.classList.add('hidden');
                resultState.classList.remove('hidden');
                
                // Attach file endpoint to the massive download button
                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.href = `/api/file/${data.filename}`;
                
            } catch (error) {
                clearInterval(statusInterval);
                showError(error.message);
            }
        }

        function showError(msg) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('processBtn').classList.remove('hidden');
            document.getElementById('errorState').classList.remove('hidden');
            document.getElementById('errorMsg').innerText = msg;
        }
    </script>
</body>
</html>
