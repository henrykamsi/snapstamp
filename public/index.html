<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapStamp - HGT Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Custom Linear Progress Bar Animation */
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #374151; /* Tailwind gray-700 */
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar {
            width: 50%;
            height: 100%;
            background-color: #3b82f6; /* Tailwind blue-500 */
            border-radius: 9999px;
            position: absolute;
            animation: loading 1.5s infinite ease-in-out;
        }
        @keyframes loading {
            0% { left: -50%; width: 50%; }
            50% { left: 25%; width: 75%; }
            100% { left: 100%; width: 50%; }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Made the container wider: max-w-3xl instead of max-w-xl -->
    <div class="max-w-3xl w-full bg-gray-800 p-8 md:p-10 rounded-2xl shadow-2xl border border-gray-700 text-center">
        <h1 class="text-4xl font-bold mb-2 text-blue-500"><i class="fa-solid fa-video"></i> SnapStamp</h1>
        <p class="text-gray-400 mb-8">Download and watermark videos, Powered by HGT</p>

        <div class="mb-6">
            <input type="url" id="videoUrl" placeholder="Paste your TikTok or YouTube link here..." 
                class="w-full p-4 rounded-lg bg-gray-700 border border-gray-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 outline-none transition-all placeholder-gray-400 text-lg">
        </div>

        <button id="processBtn" onclick="processVideo()" 
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-lg transition-all flex items-center justify-center gap-2 text-lg">
            <span>Process Video</span>
            <i class="fa-solid fa-wand-magic-sparkles"></i>
        </button>

        <!-- New Linear Progress Bar Loading State -->
        <div id="loadingState" class="hidden mt-8 flex-col items-center">
            <div class="progress-bar-container mb-4">
                <div class="progress-bar"></div>
            </div>
            <p id="loadingText" class="text-blue-400 font-medium text-lg">Initializing connection...</p>
            <p class="text-sm text-gray-500 mt-2">Please wait, processing time depends on video length and platform.</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden mt-6 p-4 bg-red-900/50 border border-red-500 text-red-200 rounded-lg">
            <p id="errorMsg"></p>
        </div>

        <!-- New Result State with Video Player and Download Button -->
        <div id="resultState" class="hidden mt-8 p-6 bg-gray-700 rounded-xl border border-gray-600 shadow-inner">
            <h3 class="text-2xl font-bold mb-2 text-green-400">Processing Complete!</h3>
            <p class="text-gray-300 mb-6">Your HGT watermark has been applied successfully.</p>
            
            <!-- Video Player Container -->
            <div class="w-full max-w-lg mx-auto bg-black rounded-lg overflow-hidden border-2 border-gray-800 shadow-lg mb-6">
                <video id="videoPlayer" class="w-full h-auto max-h-96" controls controlsList="nodownload">
                    Your browser does not support the video tag.
                </video>
            </div>

            <!-- Download Button -->
            <a id="downloadBtn" href="#" class="w-full max-w-lg mx-auto flex items-center justify-center bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-6 rounded-lg transition-all shadow-lg text-lg">
                <i class="fa-solid fa-download mr-2"></i> Download Video
            </a>
        </div>
    </div>

    <script>
        async function processVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const processBtn = document.getElementById('processBtn');
            const loadingState = document.getElementById('loadingState');
            const resultState = document.getElementById('resultState');
            const errorState = document.getElementById('errorState');
            const errorMsg = document.getElementById('errorMsg');
            const loadingText = document.getElementById('loadingText');
            
            if (!urlInput) {
                showError("Please enter a valid URL.");
                return;
            }

            errorState.classList.add('hidden');
            resultState.classList.add('hidden');
            processBtn.classList.add('hidden');
            loadingState.classList.remove('hidden');
            
            const statuses = ["Extracting video stream...", "Applying HGT watermark...", "Finalizing your file..."];
            let step = 0;
            const statusInterval = setInterval(() => {
                step = (step + 1) % statuses.length;
                loadingText.innerText = statuses[step];
            }, 4000);

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();
                clearInterval(statusInterval);

                if (!response.ok) throw new Error(data.error || "Failed to process video");

                // Update Video Player and Download Button
                const videoPlayer = document.getElementById('videoPlayer');
                const downloadBtn = document.getElementById('downloadBtn');
                
                // Set the video player source to the stream endpoint
                videoPlayer.src = `/api/stream/${data.filename}`;
                
                // Set the download button link to the file endpoint
                downloadBtn.href = `/api/file/${data.filename}`;
                
                loadingState.classList.add('hidden');
                resultState.classList.remove('hidden');
                
            } catch (error) {
                clearInterval(statusInterval);
                showError(error.message);
            }
        }

        function showError(msg) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('processBtn').classList.remove('hidden');
            document.getElementById('errorState').classList.remove('hidden');
            document.getElementById('errorMsg').innerText = msg;
        }
    </script>
</body>
</html>
